# custom: solar forecast from a Home Assistant entity attribute, see tariff/homeassistant_forecast.go
template: homeassistant-forecast
products:
  - brand: Home Assistant
    description:
      de: Prognose-Entität
      en: Forecast entity
group: solar
requirements:
  evcc: ["skiptest"]
  description:
    de: |
      Liest eine Prognose aus einem Attribut der Entität als Liste mit start, end und value in W, z. B. die Einspeise-Prognose einer anderen evcc-custom-Instanz. Nicht in derselben Instanz verwenden, die schreibt: der Optimizer würde mit doppelter PV rechnen.
    en: |
      Reads a forecast from an attribute of the entity as a list with start, end and value in W, e.g. the export forecast of another evcc custom instance. Do not use it in the instance that writes it: the optimizer would plan with double the solar power.
auth:
  type: homeassistant
  params: [uri, insecure]
params:
  - name: uri
    description:
      de: Home Assistant URI
      en: Home Assistant URI
    example: http://homeassistant.local:8123
    help:
      en: " " # overwrite default
      de: " " # overwrite default
    service: homeassistant/instances
    required: true
  - name: insecure
  - name: entity
    description:
      de: Prognose-Entität
      en: Forecast entity
    service: homeassistant/entities?uri={uri}&insecure={insecure}&domain=sensor
    example: sensor.evcc_einspeiseprognose
    required: true
  - name: attribute
    description:
      de: Attribut
      en: Attribute
    help:
      de: Attribut der Entität mit der Liste.
      en: Attribute of the entity holding the list.
    default: forecast
    advanced: true
  - name: interval
    default: 15m
    advanced: true
render: |
  type: homeassistant-forecast
  uri: {{ .uri }}
  insecure: {{ .insecure }}
  entity: {{ .entity }}
  attribute: {{ .attribute }}
  interval: {{ .interval }}
