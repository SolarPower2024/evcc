# Builds the custom evcc image for the Home Assistant addon and pushes it to
# ghcr.io. Upstream builds on depot runners, which a fork has no access to, so
# this uses plain buildx on a standard runner.
#
# That is fine here: evcc's Dockerfile cross-compiles. Both the ui and the go
# stage run on the native BUILDPLATFORM and the final stage is copy-only, so no
# qemu emulation is involved and an arm64 image builds about as fast as amd64.
#
# Tag a release to publish a version the addon can pin:
#   git tag v0.315.0-lm1 && git push origin v0.315.0-lm1
# That produces ghcr.io/<owner>/evcc-custom:0.315.0-lm1, which is what belongs
# in the addon's config.yaml. Pushes to the branch build nothing, a version is
# only built when it is tagged (or started by hand).
name: Custom image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # ghcr rejects uppercase, while github owners may contain it
      - name: Resolve image name
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/evcc-custom" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: RELEASE=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pushed" >>"$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >>"$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"
          echo "Make the package public once, otherwise Home Assistant cannot pull it." >>"$GITHUB_STEP_SUMMARY"
