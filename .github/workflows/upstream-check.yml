# Daily at noon: what evcc's newest release changed since the fork's last
# merge. The fork takes in releases only, never the commits between them. Read
# only towards evcc: it fetches evcc's release tags and never writes to evcc's
# repository.
#
# The review (.github/upstream-check/review.mjs) goes into the issue
# "evcc-Update-Check": a) what changed, b) fork features evcc may now have
# itself, c) which evcc commits cause merge conflicts, d) the PRs to open. The
# merge itself is tested in the runner. With nothing to do no issue is opened
# and an open one is closed.
#
# No issue numbers, mentions or links of evcc's repository go into any text.
#
# The update itself is done locally (skill upstream-update), not by this
# workflow.
name: evcc update check

on:
  schedule:
    - cron: "0 10 * * *" # daily 10:00 UTC = 12:00 summer time, 11:00 winter time
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: load-peak-features
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Fetch evcc
        run: |
          git remote add upstream https://github.com/evcc-io/evcc.git
          git remote set-url --push upstream DISABLED-never-push-to-evcc
          git fetch --no-tags upstream "refs/tags/0.*:refs/tags/0.*"

      - name: Review
        id: review
        run: |
          node .github/upstream-check/review.mjs release /tmp/summary.json >/tmp/report.md
          echo "ref=$(jq -r .ref /tmp/summary.json)" >>"$GITHUB_OUTPUT"
          echo "count=$(jq .count /tmp/summary.json)" >>"$GITHUB_OUTPUT"
          echo "conflicts=$(jq '.conflicts | length' /tmp/summary.json)" >>"$GITHUB_OUTPUT"

      - name: Test the merge
        if: steps.review.outputs.count != '0' && steps.review.outputs.conflicts == '0'
        env:
          REF: ${{ steps.review.outputs.ref }}
        run: |
          git -c user.name="update check" -c user.email="update-check@localhost" merge --no-edit --no-ff "$REF"
          mkdir -p dist && touch dist/empty
          {
            echo
            echo "## Tests nach dem Merge"
            echo
            if go build ./... >/tmp/test.log 2>&1 && CGO_ENABLED=0 go test -tags=release ./... >>/tmp/test.log 2>&1; then
              echo "Grün: Build und alle Tests (evcc und Fork)."
            else
              echo "Rot:"
              echo
              echo '```'
              grep -E '^(--- FAIL|FAIL|panic:)|_test.go:[0-9]+:|\.go:[0-9]+:[0-9]+:' /tmp/test.log | .github/upstream-check/clean-report.sh | head -40
              echo '```'
            fi
          } >>/tmp/report.md

      - name: Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # this repository only: with evcc fetched as a second remote gh must not guess
          GH_REPO: ${{ github.repository }}
          COUNT: ${{ steps.review.outputs.count }}
          REF: ${{ steps.review.outputs.ref }}
        run: |
          # a report is never dropped: lines referring to evcc's repository are replaced
          if grep -qE '#[0-9]|evcc-io/' /tmp/report.md; then
            sed -i -E '/#[0-9]|evcc-io\//s/.*/[entfernt]/' /tmp/report.md
            echo "::warning::report had lines referring to evcc's repository, replaced by [entfernt]"
          fi
          cat /tmp/report.md >>"$GITHUB_STEP_SUMMARY"
          title="evcc-Update-Check"
          number=$(gh issue list --state open --search "in:title $title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          # nothing to do: no new issue, an open one is done
          if [ "$COUNT" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --reason completed \
                --comment "Erledigt: alle Änderungen von $REF sind im Fork."
            fi
            exit 0
          fi
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file /tmp/report.md
          else
            gh issue create --title "$title" --body-file /tmp/report.md
          fi
