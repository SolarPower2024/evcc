# Fridays at noon: what evcc's newest release changed since the fork's last
# merge. The fork takes in releases only, never the commits between them. Read
# only towards evcc: it fetches evcc's release tags and never writes to evcc's
# repository.
#
# The review (.github/upstream-check/review.mjs) goes into the issue
# "evcc-Update-Check": a) what changed, b) fork features evcc may now have
# itself, c) which evcc commits cause merge conflicts, d) the PRs to open. The
# merge itself is tested in the runner.
#
# With the secret UPDATE_TOKEN (a token of this repository with contents, pull
# requests and workflows write) it also keeps the PR "evcc-Update" open: the
# branch evcc-update holds evcc's newest release, the PR shows the conflicts
# and is merged into load-peak-features once they are resolved. GITHUB_TOKEN
# cannot do that, as evcc's commits touch workflow files. No issue numbers,
# mentions or links of evcc's repository go into any text.
name: evcc update check

on:
  schedule:
    - cron: "0 10 * * 5" # Fridays 10:00 UTC = 12:00 summer time, 11:00 winter time
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: load-peak-features
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Fetch evcc
        run: |
          git remote add upstream https://github.com/evcc-io/evcc.git
          git remote set-url --push upstream DISABLED-never-push-to-evcc
          git fetch --no-tags upstream "refs/tags/0.*:refs/tags/0.*"

      - name: Review
        id: review
        run: |
          node .github/upstream-check/review.mjs release /tmp/summary.json >/tmp/report.md
          echo "ref=$(jq -r .ref /tmp/summary.json)" >>"$GITHUB_OUTPUT"
          echo "count=$(jq .count /tmp/summary.json)" >>"$GITHUB_OUTPUT"
          echo "conflicts=$(jq '.conflicts | length' /tmp/summary.json)" >>"$GITHUB_OUTPUT"

      - name: Test the merge
        if: steps.review.outputs.count != '0' && steps.review.outputs.conflicts == '0'
        env:
          REF: ${{ steps.review.outputs.ref }}
        run: |
          git -c user.name="update check" -c user.email="update-check@localhost" merge --no-edit --no-ff "$REF"
          mkdir -p dist && touch dist/empty
          {
            echo
            echo "## Tests nach dem Merge"
            echo
            if go build ./... >/tmp/test.log 2>&1 && CGO_ENABLED=0 go test -tags=release ./... >>/tmp/test.log 2>&1; then
              echo "Grün: Build und alle Tests (evcc und Fork)."
            else
              echo "Rot:"
              echo
              echo '```'
              grep -E '^(--- FAIL|FAIL|panic:)|_test.go:[0-9]+:|\.go:[0-9]+:[0-9]+:' /tmp/test.log | sed -E 's/#([0-9]+)/evcc PR \1/g' | head -40
              echo '```'
            fi
          } >>/tmp/report.md

      - name: Update PR
        if: steps.review.outputs.count != '0'
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ steps.review.outputs.ref }}
        run: |
          if [ -z "$UPDATE_TOKEN" ]; then
            printf '\n## Update-PR\n\nNicht angelegt: das Secret UPDATE_TOKEN fehlt.\n' >>/tmp/report.md
            exit 0
          fi
          if grep -qE '#[0-9]|evcc-io/' /tmp/report.md; then
            echo "report refers to evcc's repository, no PR"; exit 1
          fi
          export GH_TOKEN="$UPDATE_TOKEN"
          git push --force "https://x-access-token:${UPDATE_TOKEN}@github.com/${GH_REPO}.git" "$(git rev-parse "$REF^{commit}")":refs/heads/evcc-update
          title="evcc-Update: Release $REF ($(jq .count /tmp/summary.json) Commits)"
          number=$(gh pr list --head evcc-update --base load-peak-features --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file /tmp/report.md
          else
            gh pr create --head evcc-update --base load-peak-features --title "$title" --body-file /tmp/report.md
          fi
          printf '\n## Update-PR\n\nAktualisiert: %s\n' "$title" >>/tmp/report.md

      - name: Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # this repository only: with evcc fetched as a second remote gh must not guess
          GH_REPO: ${{ github.repository }}
        run: |
          if grep -qE '#[0-9]|evcc-io/' /tmp/report.md; then
            echo "report refers to evcc's repository, not posted"; exit 1
          fi
          cat /tmp/report.md >>"$GITHUB_STEP_SUMMARY"
          title="evcc-Update-Check"
          number=$(gh issue list --state open --search "in:title $title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file /tmp/report.md
          else
            gh issue create --title "$title" --body-file /tmp/report.md
          fi
