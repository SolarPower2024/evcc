# Tests of the fork on every push and pull request: the whole Go testsuite
# (evcc's own and the fork's), the race detector on the fork's packages, and
# the ui checks. Runs on GitHub's standard runners, free for a public
# repository. evcc's own workflows need depot runners and stay disabled here.
#
# Also called by custom-image.yml, so an image is only built from a green state.
name: Fork tests

on:
  push:
    branches: [load-peak-features, "review/**", "feature/**", "preview/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fork-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # main.go embeds the ui, an empty dist is enough for the tests
      - run: mkdir -p dist && touch dist/empty

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./core/... ./charger/ ./server/

      - name: Test
        run: CGO_ENABLED=0 go test -tags=release ./...

      - name: Race detector
        run: go test -race -count=1 ./core/lm/... ./core/peak/ ./core/ ./server/ ./charger/

  order:
    name: Test order
    runs-on: ubuntu-latest
    # evcc's own newDeleteTestSite leaves its database open, which breaks evcc's
    # TestProfilePercentile in some orders; reported, not blocking
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: mkdir -p dist && touch dist/empty

      - name: Shuffled
        run: CGO_ENABLED=0 go test -count=1 -shuffle=on -skip TestProfilePercentile ./core/ ./core/lm/... ./core/peak/ ./server/

  ui:
    name: UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Install
        run: make install-ui

      - name: Lint
        run: make lint-ui

      - name: Test
        run: make test-ui

      - name: Build UI
        run: make ui

      # lint formats in place: a fork file not formatted shows up here
      - name: Porcelain
        run: |
          test -z "$(git status --porcelain)" || (git status; git diff; false)
