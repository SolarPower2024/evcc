# Tests of the fork on every push and pull request: the whole Go testsuite
# (evcc's own and the fork's), the race detector on the fork's packages, and
# the ui checks. Runs on GitHub's standard runners, free for a public
# repository. evcc's own workflows need depot runners and stay disabled here.
#
# Also called by custom-image.yml, so an image is only built from a green state.
name: Fork tests

on:
  push:
    branches: [load-peak-features, "review/**", "feature/**", "preview/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fork-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # main.go embeds the ui, an empty dist is enough for the tests
      - run: mkdir -p dist && touch dist/empty

      - name: Build
        run: go build ./...

      # -z: git ls-files quotes names with umlauts (charger/weidmüller.go) otherwise
      - name: Format
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "$unformatted" | sed "s/^/::error file=/;s/$/::not formatted (gofmt)/"
            exit 1
          fi

      - name: Mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./core/... ./charger/ ./server/ ./tariff/ ./util/logstash/ ./cmd/ ./api/globalconfig/

      - name: Update check report filter
        run: bash .github/upstream-check/clean-report-test.sh

      # failures also as annotations, shown on the run page without the log
      - name: Test
        run: |
          set -o pipefail
          CGO_ENABLED=0 go test -tags=release ./... 2>&1 | tee /tmp/test.log || {
            grep -E "^(--- FAIL|FAIL|panic:)|_test.go:[0-9]+:" /tmp/test.log | head -30 | sed "s/^/::error::/"
            exit 1
          }

      - name: Race detector
        run: |
          set -o pipefail
          # charger: only the fork's tests, evcc's TestTemplates has an intermittent race of its own.
          # tariff: the same for evcc's tariff tests, only the fork's TestHAForecast*.
          # core: evcc's enableAutomatic (optimizer_automatic_test.go) writes sponsor.Subject while an
          # optimizer run started by an earlier evcc test still reads it; evcc runs no race detector.
          # The skip list is built from the sources (every test calling enableAutomatic, directly or
          # through a helper that calls it, e.g. the fork's gateScenario), so new tests of this kind
          # need no change here.
          autos="enableAutomatic|$(awk '/^func /{n=$2; sub(/\(.*/,"",n)} /enableAutomatic\(t\)/{if(n!~/^Test/)print n}' core/*_test.go | sort -u | paste -sd'|')"
          evccRace="^($(awk -v re="($autos)[(]t[,)]" '/^func Test/{n=$2; sub(/\(.*/,"",n)} $0 ~ re {print n}' core/*_test.go | sort -u | paste -sd'|'))\$"
          echo "skipped for race (evcc enableAutomatic): $evccRace"
          {
            go test -race -count=1 ./core/lm/... ./core/peak/ ./server/ ./util/logstash/ ./core/metrics/ ./core/circuit/ ./core/loadpoint/ &&
              go test -race -count=1 -skip "$evccRace" ./core/ &&
              go test -race -count=1 -run 'TestSwitchStages|TestSwitchSocketRatedPower' ./charger/ &&
                go test -race -count=1 -run 'TestHAForecast' ./tariff/
          } 2>&1 | tee /tmp/race.log || {
            grep -E "^(--- FAIL|FAIL|panic:)" /tmp/race.log | head -20 | sed "s/^/::error::/"
            # each race report as one annotation, newlines encoded
            awk '/^WARNING: DATA RACE/{r=""; on=1} on{r=r $0 "%0A"} /^={10,}/{if(on){print "::error title=Data race::" r; on=0}}' /tmp/race.log | head -5
            exit 1
          }

  order:
    name: Test order
    runs-on: ubuntu-latest
    # evcc's own newDeleteTestSite leaves its database open, which breaks evcc's
    # TestProfilePercentile in some orders; reported, not blocking
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - run: mkdir -p dist && touch dist/empty

      - name: Shuffled
        run: CGO_ENABLED=0 go test -count=1 -shuffle=on -skip TestProfilePercentile ./core/ ./core/lm/... ./core/peak/ ./server/ ./util/logstash/ ./core/metrics/ ./core/circuit/

  ui:
    name: UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Install
        run: make install-ui

      - name: Lint
        run: make lint-ui

      - name: Test
        run: make test-ui

      - name: Build UI
        run: make ui

      # lint formats in place: a fork file not formatted shows up here
      - name: Porcelain
        run: |
          test -z "$(git status --porcelain)" || (git status; git diff; false)

  # authors and texts of the commits of a pull request, see .github/commit-guard/guard.sh
  commit-guard:
    name: Commit guard
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'preview/') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Selftest
        run: bash .github/commit-guard/guard-selftest.sh

      # title and body as environment variables, never interpolated into the script
      - name: Guard
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/commit-guard/guard.sh ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
